<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>داشبورد الزيارات المنزلية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#273548;--text:#e2e8f0;--text2:#94a3b8;
  --accent:#3b82f6;--accent2:#60a5fa;--green:#22c55e;--red:#ef4444;--yellow:#eab308;
  --orange:#f97316;--purple:#a855f7;--border:#334155;--radius:14px;--shadow:0 4px 20px rgba(0,0,0,.3);
}
.light{
  --bg:#f1f5f9;--card:#ffffff;--card2:#f8fafc;--text:#1e293b;--text2:#475569;
  --border:#e2e8f0;--shadow:0 4px 20px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;overflow:hidden;}
body{
  font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);
  height:100%;overflow:hidden;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
  padding-top:env(safe-area-inset-top);
  transition:background .3s,color .3s;
}
.app-scroll{
  height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:none;
}
.header{
  position:sticky;top:0;z-index:100;
  background:var(--bg);padding:12px 16px 8px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.header h1{font-size:17px;font-weight:700;}
.header-actions{display:flex;gap:10px;align-items:center;}
.theme-btn{
  background:var(--card);border:1px solid var(--border);border-radius:50%;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;transition:all .2s;
}
.tab-content{display:none;padding:12px 14px 20px;animation:fadeUp .35s ease;}
.tab-content.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--card);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:center;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  transform:translateZ(0);-webkit-transform:translateZ(0);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 6px;border-radius:10px;cursor:pointer;transition:all .2s;
  font-size:9px;color:var(--text2);min-width:48px;
}
.nav-item.active{color:var(--accent2);}
.nav-item .icon{font-size:20px;line-height:1;}
.nav-item .label{font-weight:600;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.kpi-card{
  background:var(--card);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);transition:all .3s;
  animation:cardIn .4s ease backwards;position:relative;overflow:hidden;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.kpi-card .kpi-icon{font-size:20px;margin-bottom:4px;}
.kpi-card .kpi-value{font-size:18px;font-weight:800;line-height:1.2;word-break:break-word;}
.kpi-card .kpi-label{font-size:11px;color:var(--text2);margin-top:4px;}
.kpi-card .kpi-sub{font-size:10px;color:var(--text2);margin-top:2px;}
.kpi-card .kpi-delta{font-size:10px;margin-top:4px;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:2px;}
.kpi-delta.up{color:#22c55e;background:rgba(34,197,94,0.12);}
.kpi-delta.down{color:#ef4444;background:rgba(239,68,68,0.12);}
.kpi-delta.flat{color:var(--text2);background:rgba(100,116,139,0.1);}
.kpi-card.wide{grid-column:span 2;}
.section-title{font-size:15px;font-weight:700;color:var(--accent2);margin:16px 0 10px;padding-right:10px;border-right:3px solid var(--accent2);}
.section-title.green{color:#22c55e;border-color:#22c55e;}
.section-title.amber{color:#fbbf24;border-color:#fbbf24;}
.section-title.purple{color:#a855f7;border-color:#a855f7;}
.section-title.rose{color:#f472b6;border-color:#f472b6;}
.section-title.teal{color:#2dd4bf;border-color:#2dd4bf;}

.scroll-table-wrap,.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px;}
.scroll-table-wrap table,.table-wrap table,.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;}
.scroll-table-wrap th,.table-wrap th,.data-table th{background:var(--card);padding:10px 8px;text-align:right;font-weight:700;color:var(--accent);font-size:11px;position:sticky;top:0;z-index:3;white-space:nowrap;border-bottom:2px solid var(--border);}
.scroll-table-wrap td,.table-wrap td,.data-table td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5;vertical-align:middle;}
.scroll-table-wrap tr:last-child td,.table-wrap tr:last-child td,.data-table tr:last-child td{border-bottom:none;}
.scroll-table-wrap tr:nth-child(even) td,.table-wrap tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
.table-wrap .total-row td,.scroll-table-wrap .total-row td{border-top:2px solid var(--accent);font-weight:800;background:rgba(52,211,153,0.06) !important;}
.td-name{font-weight:700;font-size:12px;white-space:nowrap;}
.td-num{font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.td-money{color:var(--green);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
.td-pct{font-size:11px;color:var(--text2);white-space:nowrap;}
.td-sub{font-size:10px;color:var(--text2);white-space:nowrap;}
.sort-btn{background:var(--card);color:var(--text2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.sort-btn.active{background:var(--accent);color:#0f172a;border-color:var(--accent);}
.summary-box{background:var(--card);border-radius:var(--radius);padding:14px;font-size:12px;line-height:1.8;color:var(--text);box-shadow:var(--shadow);margin-bottom:14px;border-right:3px solid var(--accent);}
.summary-box strong,.summary-box span{color:var(--accent2);font-weight:700;}
.summary-box .warn{color:#ef4444;}
.alerts-wrap{margin-bottom:14px;}
.alert-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;margin-bottom:6px;font-size:11px;line-height:1.6;}
.alert-item.red{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);}
.alert-item.yellow{background:rgba(234,179,8,0.1);border:1px solid rgba(234,179,8,0.25);}
.alert-item.blue{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.25);}
.alert-item.green{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);}
.alert-item.purple{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.25);}
.alert-icon{font-size:16px;flex-shrink:0;margin-top:1px;}
.alert-text{flex:1;}
.alert-text strong{color:var(--text);font-weight:700;}
.no-alerts{text-align:center;padding:12px;font-size:12px;color:var(--text2);background:var(--card);border-radius:10px;}
.search-box{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:'Cairo';font-size:13px;outline:none;margin-bottom:10px;transition:border-color .2s;}
.search-box:focus{border-color:var(--accent);}
.sort-btns{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.sort-btn{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;background:var(--card);color:var(--text2);cursor:pointer;border:1px solid var(--border);font-family:'Cairo';transition:all .2s;}
.sort-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.filter-bar{margin-bottom:12px;}
.filter-bar select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:'Cairo';font-size:13px;outline:none;}
.match-card{background:var(--card);border-radius:var(--radius);padding:12px;margin-bottom:8px;box-shadow:var(--shadow);}
.mc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.mc-teams{font-weight:700;font-size:13px;}
.mc-amount{color:var(--green);font-weight:800;font-size:14px;}
.mc-details{font-size:10px;color:var(--text2);line-height:1.8;}
.mc-badge{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:600;}
.practitioner-card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);animation:cardIn .4s ease backwards;}
.pc-name{font-weight:700;font-size:13px;}
.pc-stat{font-size:10px;color:var(--text2);margin-top:2px;}
.pc-revenue{color:var(--green);font-weight:800;font-size:15px;}
.mom-card{background:var(--card);border-radius:10px;padding:10px;text-align:center;box-shadow:var(--shadow);}
.mom-card .mc-type{font-size:11px;font-weight:700;color:var(--text);margin-bottom:4px;}
.mom-card .mc-current{font-size:16px;font-weight:800;color:var(--accent2);}
.mom-card .mc-prev{font-size:10px;color:var(--text2);margin-top:2px;}
.mom-card .mc-change{font-size:11px;font-weight:700;margin-top:4px;}
.mom-card .mc-change.up{color:#22c55e;}
.mom-card .mc-change.down{color:#ef4444;}
.bar-fill{height:6px;border-radius:3px;transition:width .3s;}
.bar-bg{height:6px;border-radius:3px;background:var(--border);flex:1;}
.bar-wrap{display:flex;align-items:center;gap:6px;}
.heatmap-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;}
.heatmap-table{width:100%;border-collapse:collapse;font-size:10px;white-space:nowrap;}
.heatmap-table th{background:var(--bg);color:var(--text2);padding:5px 4px;text-align:center;font-size:9px;font-weight:600;position:sticky;top:0;z-index:2;}
.heatmap-table td{padding:4px 3px;text-align:center;border:1px solid var(--bg);font-size:9px;}
.heatmap-table td:first-child{text-align:right;font-weight:600;color:var(--text);background:var(--bg);position:sticky;right:0;z-index:1;white-space:nowrap;font-size:10px;padding:4px 6px;}
.search-box{scroll-margin-top:200px;}
</style>
</head>

</div>

const _patientNameMap={};
function buildPatientNameMap(data){
  Object.keys(_patientNameMap).forEach(k=>delete _patientNameMap[k]);
  const groups={};
  data.forEach(d=>{if(!d.patient||d.patient==="-")return;const parts=d.patient.trim().split(/\s+/);if(parts.length<2)return;const key=(parts[0]+" "+parts[parts.length-1]).toLowerCase();if(!groups[key])groups[key]=[];groups[key].push(d.patient);});

}

}
function onGlobalMonthChange(v){
  _globalMonth=v;
  localStorage.setItem('globalMonth',v);
  renderTab(currentTab);
}
function filterByMonth(arr){
  if(_globalMonth==='all')return arr;
  return arr.filter(d=>d.date&&d.date.startsWith(_globalMonth));
}

let currentTab=localStorage.getItem('activeTab')||'overview';

function switchTab(tab){
  currentTab=tab;
  localStorage.setItem('activeTab',tab);
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  const target=document.getElementById('tab-'+tab);
  if(target)target.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el=>{el.classList.toggle('active',el.dataset.tab===tab);});
  document.getElementById('appScroll').scrollTop=0;
  renderTab(tab);
}

function renderTab(tab){
  switch(tab){
    case 'overview':renderOverview();break;
    case 'income':renderIncome();break;
    case 'visits':renderVisits();break;
    case 'practitioners':renderPractitioners();break;
    case 'ambulance':renderAmbulance();break;
    case 'matches':renderMatches();break;
  }
}

    const delta=(cur,prev)=>{if(!prev)return'<span style="color:#94a3b8">—</span>';const d=cur-prev,pct=prev?(Math.abs(d)/prev*100).toFixed(1):"∞";if(d>0)return'<span style="color:#34d399">↑ '+pct+'%</span>';if(d<0)return'<span style="color:#f87171">↓ '+pct+'%</span>';return'<span style="color:#94a3b8">مستقر</span>';};
    dVisits=delta(lRaw.length,pRaw.length);
    dRev=delta(sumAmount(lBill),sumAmount(pBill));
    const lA=lBill.length?sumAmount(lBill)/lBill.length:0;
    const pA=pBill.length?sumAmount(pBill)/pBill.length:0;
    dAvg=delta(lA,pA);
    const lP=new Set(lMed.filter(d=>d.practitioner&&d.practitioner!=='-').map(d=>d.practitioner)).size;
    const pP=new Set(pMed.filter(d=>d.practitioner&&d.practitioner!=='-').map(d=>d.practitioner)).size;
    dPract=delta(lP,pP);
    const lD=new Set(lRaw.filter(d=>d.date).map(d=>d.date)).size;

    dDays=delta(lD,pD);

    <div class="kpi-card"><div class="kpi-icon">📊</div><div class="kpi-value">${fmtCur(visAvg)}</div><div class="kpi-label">متوسط المبلغ/زيارة</div><div class="kpi-sub">زيارات: ${fmtCur(visAvg)} | مباريات: ${fmtCur(matchAvgKpi)}</div><div class="kpi-delta">${dAvg}</div></div>

    <div class="kpi-card"><div class="kpi-icon">📅</div><div class="kpi-value">${fmt(activeDays)}</div><div class="kpi-label">الأيام النشطة</div><div class="kpi-sub">${totalDays?'من أصل '+fmt(totalDays)+' يوم':''}</div><div class="kpi-delta">${dDays}</div></div>
    <div class="kpi-card"><div class="kpi-icon">⚽</div><div class="kpi-value">${fmt(matchCount)}</div><div class="kpi-label">المباريات</div><div class="kpi-sub">${fmtCur(matchRevKpi)}</div></div>
  </div>
  <div id="overviewAlertsWrap"></div>

}

function renderIncome(){
  populateMonthFilter();
  const el=document.getElementById('tab-income');
  const fMed=filterByMonth(med);
  const fMatch=filterByMonth(MATCHES_RAW);
  const visitRev=sumAmount(fMed), visitCnt=fMed.length;
  const visitBillable=fMed.filter(d=>d.visit_type!=="العلاقات/التسويق");
  const visitIncomeAvg=visitBillable.length?visitRev/visitBillable.length:0;
  const matchRev=sumAmount(fMatch);
  const matchAvgRev=fMatch.length?matchRev/fMatch.length:0;
  const totalRev=visitRev+matchRev;
  // Max day revenue from med
  const dailyVis={};fMed.forEach(d=>{if(d.date)dailyVis[d.date]=(dailyVis[d.date]||0)+(d.amount||0);});
  const maxDayVis=Object.entries(dailyVis).sort((a,b)=>b[1]-a[1])[0]||['',0];
  const uniqueDays=Object.keys(dailyVis).length;
  const AR_DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const maxDayName=maxDayVis[0]?AR_DAYS[new Date(maxDayVis[0]).getDay()]:'';
  const visAvgDay=uniqueDays?visitRev/uniqueDays:0;
  const zeroRevVis=fMed.filter(d=>d.amount===0).length;
  const zeroRevMatch=fMatch.filter(d=>!d.amount||d.amount===0).length;
  const brG=grp(fMed,'branch');
  const topBr=Object.entries(brG).map(([n,v])=>({n,r:sumAmount(v)})).sort((a,b)=>b.r-a.r)[0]||{n:'—',r:0};
  // Growth: med + matches combined monthly
  const _mG={};
  [...med,...MATCHES_RAW.map(d=>({...d}))].forEach(d=>{if(d.date){const m=getMonth(d.date);if(!_mG[m])_mG[m]=0;_mG[m]+=(d.amount||0);}});
  const _ms=Object.keys(_mG).sort();
  let growthPct='—',growthColor='#94a3b8',growthSub='';
  if(_ms.length>=2){
    const last=_mG[_ms[_ms.length-1]],prev=_mG[_ms[_ms.length-2]];
    const g=prev?((last-prev)/prev*100):0;
    growthPct=(g>=0?'+':'')+g.toFixed(1)+'%';
    growthColor=g>=0?'#34d399':'#f87171';
    growthSub=mnName(_ms[_ms.length-1])+' مقارنة بـ '+mnName(_ms[_ms.length-2]);
  }
  let forecast='—',forecastSub='';
  if(_ms.length>=2){
    const last3=_ms.slice(-3).map(m=>_mG[m]);
    const fc=last3.reduce((a,b)=>a+b,0)/last3.length;
    forecast=fmtCur(fc);
    forecastSub='بناءً على متوسط آخر '+last3.length+' أشهر';
  }
  // Monthly table (med + matches combined)
  const monthly={};
  med.forEach(d=>{if(!d.date)return;const m=getMonth(d.date);if(!monthly[m])monthly[m]={v:0,r:0,vr:0,mr:0,mc:0};monthly[m].v++;monthly[m].r+=(d.amount||0);monthly[m].vr+=(d.amount||0);});
  MATCHES_RAW.forEach(d=>{if(!d.date)return;const m=getMonth(d.date);if(!monthly[m])monthly[m]={v:0,r:0,vr:0,mr:0,mc:0};monthly[m].v++;monthly[m].r+=(d.amount||0);monthly[m].mr+=(d.amount||0);monthly[m].mc++;});
  const mKeys=Object.keys(monthly).sort();

  el.innerHTML=`
  <div class="section-title">💰 الدخل والإيرادات</div>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-icon">🏠</div><div class="kpi-value">${fmtCur(visitRev)}</div><div class="kpi-label">دخل الزيارات</div><div class="kpi-sub">${fmt(visitCnt)} زيارة | متوسط ${fmtCur(visitIncomeAvg)}</div></div>
    <div class="kpi-card"><div class="kpi-icon">⚽</div><div class="kpi-value">${fmtCur(matchRev)}</div><div class="kpi-label">دخل المباريات</div><div class="kpi-sub">${fmt(fMatch.length)} مباراة | متوسط ${fmtCur(matchAvgRev)}</div></div>
    <div class="kpi-card"><div class="kpi-icon">📈</div><div class="kpi-value">${fmtCur(maxDayVis[1])}</div><div class="kpi-label">أعلى إيراد يوم</div><div class="kpi-sub">${maxDayName} ${maxDayVis[0]}</div></div>
    <div class="kpi-card"><div class="kpi-icon">📊</div><div class="kpi-value">${fmtCur(visAvgDay)}</div><div class="kpi-label">متوسط إيرادات يومية</div></div>
    <div class="kpi-card"><div class="kpi-icon">🚫</div><div class="kpi-value">${fmt(zeroRevVis+zeroRevMatch)}</div><div class="kpi-label">بدون إيراد</div><div class="kpi-sub">زيارات: ${fmt(zeroRevVis)} | مباريات: ${fmt(zeroRevMatch)}</div></div>
    <div class="kpi-card"><div class="kpi-icon">🏢</div><div class="kpi-value">${topBr.n.replace('عادل كير ','').replace('بلوديم ','')}</div><div class="kpi-label">أعلى فرع</div><div class="kpi-sub">${fmtCur(topBr.r)}</div></div>
    <div class="kpi-card"><div class="kpi-icon">📈</div><div class="kpi-value" style="color:${growthColor}">${growthPct}</div><div class="kpi-label">نمو الإيرادات</div><div class="kpi-sub">${growthSub}</div></div>
    <div class="kpi-card"><div class="kpi-icon">🔮</div><div class="kpi-value">${forecast}</div><div class="kpi-label">توقع الشهر القادم</div><div class="kpi-sub">${forecastSub}</div></div>
  </div>
  <div class="section-title">📅 الإيرادات الشهرية</div>
  <div class="scroll-table-wrap"><table class="data-table"><thead><tr><th>الشهر</th><th>العدد</th><th>الإيرادات</th><th>التغيير</th></tr></thead>
  <tbody>${mKeys.map((m,i)=>{const d=monthly[m];const prev=i>0?monthly[mKeys[i-1]]:null;const trend=prev&&prev.r>0?((d.r-prev.r)/prev.r*100):null;const arrow=trend!==null?(trend>0?'<span style="color:#34d399;font-weight:700">↑'+Math.abs(trend).toFixed(0)+'%</span>':'<span style="color:#f87171;font-weight:700">↓'+Math.abs(trend).toFixed(0)+'%</span>'):'<span class="td-sub">—</span>';return '<tr><td class="td-name">'+mnName(m)+'</td><td class="td-num">'+fmt(d.v)+'</td><td class="td-money">'+fmtCur(d.r)+'</td><td>'+arrow+'</td></tr>';}).join('')}
  <tr class="total-row"><td class="td-name">الإجمالي</td><td class="td-num">${fmt(mKeys.reduce((s,m)=>s+monthly[m].v,0))}</td><td class="td-money">${fmtCur(mKeys.reduce((s,m)=>s+monthly[m].r,0))}</td><td></td></tr>
  </tbody></table></div>`;
}

function filterVisitsRows(val){
  const q=val.trim().toLowerCase();let shown=0,total=0;
  document.querySelectorAll('#visitsAllBody tr').forEach(r=>{total++;const s=r.dataset.vsearch||'';const show=!q||s.includes(q);r.style.display=show?'':'none';if(show)shown++;});
  const cnt=document.getElementById('visitsSearchCount');
  if(cnt)cnt.textContent=q?'عرض '+shown+' من '+total:'';
}
function renderVisitsAlerts(data){
  const alerts=[];
  const EXEMPT=["علاج طبيعي","العلاقات/التسويق","ممرض/ة"];
  const vtG=grp(data,'visit_type');
  Object.entries(vtG).forEach(([type,visits])=>{
    if(EXEMPT.includes(type)||!type||type==='-')return;
    const zeroCount=visits.filter(d=>d.amount===0).length;
    const pct=visits.length?zeroCount/visits.length:0;
    if(pct>=0.6&&visits.length>=3) alerts.push({t:'red',i:'🚨',tx:type+': نسبة التحصيل منخفضة ('+Math.round(pct*100)+'% بدون إيراد)'});
  });
  const lastM=allMonths[allMonths.length-1],prevM=allMonths[allMonths.length-2];
  if(prevM){
    const lastData=med.filter(d=>d.date&&d.date.startsWith(lastM));
    const prevData=med.filter(d=>d.date&&d.date.startsWith(prevM));
    const lR=sumAmount(lastData),pR=sumAmount(prevData);
    if(pR>0){const pct=((lR-pR)/pR*100);if(pct<-20) alerts.push({t:'yellow',i:'📉',tx:'إيرادات '+mnName(lastM)+' انخفضت '+Math.abs(pct).toFixed(1)+'% مقارنة بـ'+mnName(prevM)});}
    const types=['طبيب/ة','اخصائي/ة'];
    const prevDocs=new Set(prevData.filter(d=>types.includes(d.visit_type)&&d.practitioner&&d.practitioner!=='-').map(d=>d.practitioner));
    const lastDocs=new Set(lastData.filter(d=>types.includes(d.visit_type)&&d.practitioner&&d.practitioner!=='-').map(d=>d.practitioner));
    const inactiveDocs=[...prevDocs].filter(p=>!lastDocs.has(p)&&!FORMER_PRACTS.some(fp=>p.includes(fp)));
    if(inactiveDocs.length>0) alerts.push({t:'yellow',i:'👨‍⚕️',tx:inactiveDocs.length+' طبيب/أخصائي لم يسجل زيارات في '+mnName(lastM)});
  }
  const wrap=document.getElementById('visitsAlertsWrap');
  if(wrap&&alerts.length) wrap.innerHTML='<div class="section-title" style="margin-top:16px">⚠️ تنبيهات</div>'+alerts.map(a=>'<div class="alert-card '+a.t+'"><span>'+a.i+'</span><div>'+a.tx+'</div></div>').join('');
}

  }

      <thead><tr><th>الشهر</th><th>المباريات</th><th>الإيرادات</th><th>المتوسط</th></tr></thead>
      <tbody>${mStats.map(s=>`<tr><td class="td-name" style="color:#a855f7">${mnName(s.m)}</td><td class="td-num">${fmt(s.c)}</td><td class="td-money">${fmtCur(Math.round(s.r))}</td><td class="td-sub">${fmtCur(Math.round(s.c?s.r/s.c:0))}</td></tr>`).join('')}
      <tr class="total-row"><td class="td-name">الإجمالي</td><td class="td-num">${fmt(totalM)}</td><td class="td-money">${fmtCur(Math.round(totalMRev))}</td><td class="td-sub">${fmtCur(Math.round(avgM))}</td></tr>
      </tbody></table></div>
    <div class="alerts-wrap">${mAlerts.length?mAlerts.map(a=>`<div class="alert-item ${a.type}"><span class="alert-icon">${a.icon}</span><div class="alert-text">${a.text}</div></div>`).join(''):`<div class="no-alerts">✅ لا توجد تنبيهات</div>`}</div>
    <div class="section-title purple">📝 الملخص</div>
    <div class="summary-box">سُجِّلت <strong>${fmt(totalM)}</strong> مباراة بإجمالي <strong>${fmtCur(Math.round(totalMRev))}</strong>. أكثر شهر: <strong>${mnName(bestM.m)}</strong> بـ <strong>${bestM.c}</strong> مباراة. أعلى إيرادات: <strong>${mnName(bestRevM.m)}</strong> بـ <strong>${fmtCur(Math.round(bestRevM.r))}</strong>.</div>
    <div class="section-title purple">🏟️ إيرادات الأندية</div>
    <div class="scroll-table-wrap"><table class="data-table">
      <thead><tr><th>#</th><th>النادي</th><th>المباريات</th><th>الإيرادات</th></tr></thead>
      <tbody>${clubEntries.map(([n,d],i)=>`<tr><td class="td-num">${i+1}${['🥇','🥈','🥉'][i]||''}</td><td class="td-name">${n}</td><td class="td-num">${fmt(d.c)}</td><td class="td-money">${fmtCur(Math.round(d.r))}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="section-title purple">📋 تفاصيل المباريات</div>
    <input type="text" class="search-box" id="matchSearchInput" placeholder="🔍 بحث عن نادي، فريق، موقع..." value="${matchSearchVal}" oninput="matchSearchVal=this.value;filterMatchRows();">
    <div id="matchSearchCount" style="font-size:10px;color:var(--text2);margin-bottom:6px;"></div>
    <div class="scroll-table-wrap" style="max-height:350px;overflow-y:auto;overflow-x:hidden;"><table class="data-table" style="table-layout:fixed;">
      <thead><tr><th style="width:22%">التاريخ</th><th>النادي / الفريقين</th><th style="width:20%">المبلغ</th></tr></thead>
      <tbody id="matchDetailsBody">${allSorted.map(d=>`<tr data-search="${[d.date,d.club,d.teams,d.category,d.location,d.paramedic,d.driver].join(' ').toLowerCase()}"><td><div class="td-sub">${d.date}</div>${d.driver&&d.driver!=='-'&&d.driver!==''?'<div class="td-sub" style="font-size:9px;color:#94a3b8">'+d.driver+'</div>':''}</td><td><div class="td-name" style="font-size:11px">${d.club||'—'}</div><div class="td-sub">${d.teams||'—'} · ${d.category||''}</div>${d.location&&d.location!=='-'&&d.location!==''?'<div class="td-sub" style="font-size:9px;color:#94a3b8">📍 '+d.location+'</div>':''}</td><td class="td-money">${fmtCur(d.amount)}</td></tr>`).join('')}</tbody>
    </table></div>
  `;
}

function _fixSearchScroll(){
  ['visitsSearchInput','matchSearchInput'].forEach(id=>{
    const el=document.getElementById(id);
    if(el&&!el._scrollFixed){
      el._scrollFixed=true;
      el.addEventListener('focus',function(){setTimeout(()=>{this.scrollIntoView({block:'center',behavior:'smooth'});},300);});
    }
  });
}
function _fixPractSearchScroll(){
  const el=document.getElementById('practSearchInput');
  if(el&&!el._scrollFixed){
    el._scrollFixed=true;
    el.addEventListener('focus',function(){setTimeout(()=>{this.scrollIntoView({block:'center',behavior:'smooth'});},300);});
  }
}
function filterPractRows(val){
  const q=val.trim().toLowerCase();let shown=0,total=0;
  document.querySelectorAll('#practAllBody tr:not(.total-row)').forEach(r=>{total++;const s=r.dataset.psearch||'';const show=!q||s.includes(q);r.style.display=show?'':'none';if(show)shown++;});
  const cnt=document.getElementById('practSearchCount');
  if(cnt)cnt.textContent=q?'عرض '+shown+' من '+total:'';
}
function sortPract(by){
  const body=document.getElementById('practAllBody');
  if(!body)return;
  const rows=[...body.querySelectorAll('tr:not(.total-row)')];
  const key=by==='visits'?'pvisits':by==='avg'?'pavg':'prev';
  rows.sort((a,b)=>parseFloat(b.dataset[key]||0)-parseFloat(a.dataset[key]||0));
  const badges=['🥇','🥈','🥉'];
  rows.forEach((r,i)=>{r.querySelector('td').innerHTML='<span class="td-num">'+(i+1)+(badges[i]||'')+'</span>';body.appendChild(r);});
  document.querySelectorAll('#practSortBtns .sort-btn').forEach(b=>{b.classList.toggle('active',b.dataset.sort===by);});
}
function filterMatchRows(){
  const q=matchSearchVal.trim().toLowerCase();
  let shown=0,total=0;
  document.querySelectorAll('#matchDetailsBody tr').forEach(r=>{total++;const s=r.dataset.search||'';const show=!q||s.includes(q);r.style.display=show?'':'none';if(show)shown++;});
  const cnt=document.getElementById('matchSearchCount');
  if(cnt)cnt.textContent=q?`عرض ${shown} من ${total}`:'';
}

document.querySelectorAll('.nav-item').forEach(el=>{el.addEventListener('click',()=>switchTab(el.dataset.tab));});

switchTab(currentTab);

function toggleTheme(){
  document.body.classList.toggle('light');
  const isLight=document.body.classList.contains('light');
  document.getElementById('themeBtn').textContent=isLight?'🌙':'☀️';
  document.querySelector('meta[name="theme-color"]').content=isLight?'#f1f5f9':'#0f172a';
  localStorage.setItem('theme',isLight?'light':'dark');
  renderTab(currentTab);
}

const GSHEET_ID="1--un9vvzDezQNXTzg2zEPkBZoxYEKYMBBjXqEyGGtZ4";
const _VS_URL=`https://docs.google.com/spreadsheets/d/${GSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("الزيارات المنزلية")}`;
const _MS_URL=`https://docs.google.com/spreadsheets/d/${GSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("المباريات")}`;
function _csvParse(t){const rows=[];const lines=t.split('\n');for(const line of lines){if(!line.trim())continue;const cells=[];let cell='',inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(inQ){if(ch==='"'&&line[i+1]==='"'){cell+='"';i++;}else if(ch==='"'){inQ=false;}else{cell+=ch;}}else{if(ch==='"'){inQ=true;}else if(ch===','){cells.push(cell);cell='';}else{cell+=ch;}}}cells.push(cell);rows.push(cells);}return rows;}
function _mdyToYmd(s){if(!s)return"";if(s.includes("-"))return s;const p=s.split("/");if(p.length===3){const d=p[0].padStart(2,"0"),m=p[1].padStart(2,"0"),y=p[2];return`${y}-${m}-${d}`;}return s;}
function _parseAmt(s){return parseFloat((s||"0").replace(/٫/g,".").replace(/,/g,""))||0;}
function _parseVisitsCSV(t){const R=_csvParse(t);if(R.length<2)return[];return R.slice(1).filter(r=>r[0]||r[1]).map(r=>({id:r[0]||"-",visit_type:r[1]||"-",patient:r[2]||"-",practitioner:r[3]||"-",payment:r[4]||"-",amount:_parseAmt(r[5]),invoice:r[6]||"-",branch:r[7]||"-",exit_time:r[8]||"",driver:r[9]||"-",notes:r[10]||"",date:_mdyToYmd(r[11])||""}));}
function _parseMatchesCSV(t){const R=_csvParse(t);if(R.length<2)return[];return R.slice(1).filter(r=>r[0]||r[1]).map(r=>({club:r[0]||"-",teams:r[1]||"-",category:r[2]||"-",date:_mdyToYmd(r[3])||"",match_time:r[4]||"",exit_time:r[5]||"",location:r[6]||"-",coverage:r[7]||"-",branch:r[8]||"-",paramedic:r[9]||"-",driver:r[10]||"-",amount:_parseAmt(r[11])}));}

function _setSyncBar(ok,msg){let b=document.getElementById("syncBar");if(!b){b=document.createElement("div");b.id="syncBar";b.style.cssText="position:fixed;bottom:0;left:0;right:0;text-align:center;padding:5px 8px;font-size:11px;z-index:9998;";document.body.appendChild(b);const nav=document.querySelector('.bottom-nav');if(nav)nav.style.bottom="26px";document.body.style.paddingBottom=(parseInt(getComputedStyle(document.body).paddingBottom)||0)+26+"px";}b.style.background=ok?"#166534":"#991b1b";b.style.color="#fff";b.innerHTML=msg;}

(async function(){_setSyncBar(false,"🔄 جاري تحديث البيانات...");try{const[vR,mR]=await Promise.all([fetch(_VS_URL,{cache:"no-store"}),fetch(_MS_URL,{cache:"no-store"})]);if(!vR.ok||!mR.ok)throw new Error("fetch failed");const[vT,mT]=await Promise.all([vR.text(),mR.text()]);const nV=_parseVisitsCSV(vT),nM=_parseMatchesCSV(mT);if(nV.length>0){RAW=nV;if(nM.length>0)MATCHES_RAW=nM;console.log("✅ Google Sheets:",RAW.length,"visits,",MATCHES_RAW.length,"matches");_reprocessData();renderTab(currentTab);const now=new Date();const time=now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");_setSyncBar(true,"✅ متصل بقوقل شيت — "+RAW.length+" زيارة | آخر تحديث "+time);}}catch(e){console.warn("⚠️ Using embedded data:",e.message);_setSyncBar(false,"⚠️ غير متصل — بيانات محفوظة");}})();
</script>
